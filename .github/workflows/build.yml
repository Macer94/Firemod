name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxcb-shape0 libxkbcommon-x11-0 libgtk-3-0
      - name: Install locked dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install Firemod
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: python -m pytest -q
      - name: GUI smoke test
        run: python -m firemod.app --screenshot build/source-preview.png
      - name: Build native release
        run: python scripts/build_desktop.py
      - name: Packaged Linux smoke test
        if: runner.os == 'Linux'
        run: ./dist/Firemod/Firemod --screenshot build/binary-preview.png
      - name: Packaged Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/Firemod/Firemod.exe' -ArgumentList '--screenshot', 'build/binary-preview.png' -PassThru -Wait
          if ($process.ExitCode -ne 0 -or !(Test-Path 'build/binary-preview.png')) { throw 'Packaged GUI smoke test failed' }
      - name: Upload native packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Firemod-${{ runner.os }}-x86_64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Firemod-*
          merge-multiple: true
          path: artifacts
      - name: Assemble checksums and Android assets
        run: |
          cp resources/android/firemod-home.apk resources/android/firemod-bridge.jar artifacts/
          cd artifacts
          cat *.sha256 > SHA256SUMS
          sha256sum firemod-home.apk firemod-bridge.jar >> SHA256SUMS
      - name: Publish release after both native builds pass
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.apk
            artifacts/*.jar
            artifacts/SHA256SUMS
